# 開発用の環境（本番用ではない）
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: pagewright
      POSTGRES_PASSWORD: pagewright
      POSTGRES_DB: pagewright
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pagewright", "-d", "pagewright"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  db-data:
