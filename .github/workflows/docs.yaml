# Publishes the docs site (VitePress + Pagefind) to GitHub Pages at
# https://kom3da.github.io/pagewright/ when docs change on main.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "schema/**"
      - "web/admin/DESIGN.md"
      - ".github/workflows/docs.yaml"
      - "mise.toml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # "最終更新" on each page comes from the git history.
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm github:Pagefind/pagefind
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DOCS_BASE: /pagewright/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
