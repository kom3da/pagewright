{{define "main" -}}
{{- if .Site.LegacyRedirects}}
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var key = ["p", "page_id"].find(function (k) { return /^\d+$/.test(q.get(k) || ""); });
  if (!key) return;
  fetch("/_legacy.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
    var to = m && m[key] && m[key][q.get(key)];
    if (to) location.replace(to);
  });
})();
</script>
{{- end}}
<div class="hero">
  <div class="container">
    <h1 class="hero__title">{{with .Content}}{{.Title}}{{else}}{{.Site.Name}}{{end}}</h1>
  </div>
</div>
<div class="container">
  {{- with .Content}}
  <div class="entry-body">
{{.Body}}
  </div>
  {{- end}}
  <section class="home-news" aria-labelledby="home-news-heading">
    <h2 id="home-news-heading">お知らせ</h2>
    {{template "post-list" .Posts}}
    <p class="more-link"><a href="{{.Site.PostsURL}}">お知らせ一覧を見る</a></p>
  </section>
</div>
{{- end}}
