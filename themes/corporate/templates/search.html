{{define "main" -}}
<div class="page-head">
  <div class="container">
    <p class="eyebrow" aria-hidden="true">SEARCH</p>
    <h1>サイト内検索</h1>
  </div>
</div>
<div class="container container--narrow list-body">
  <link rel="stylesheet" href="/pagefind/pagefind-ui.css">
  <div id="search"></div>
  <noscript><p>検索にはJavaScriptが必要です。</p></noscript>
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    new PagefindUI({ element: "#search", showSubResults: true, showImages: false, autofocus: true });
  </script>
</div>
{{- end}}
