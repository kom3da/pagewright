[tools]
go = "1.27"
node = "24"
pnpm = "12.6.0"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"aqua:pressly/goose" = "3.30.1"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:goreleaser/goreleaser" = "2.20.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
"aqua:rhysd/actionlint" = "1.7.12"
"github:sbdchd/squawk" = "2.74.0"

# The extended build segments Japanese. Pick the asset per platform: a
# bare pattern matches another architecture's file first.
[tools."github:Pagefind/pagefind"]
version = "1.6.0"

[tools."github:Pagefind/pagefind".platforms]
linux-x64 = { asset_pattern = "pagefind_extended-v*-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "pagefind_extended-v*-aarch64-unknown-linux-musl.tar.gz" }
macos-x64 = { asset_pattern = "pagefind_extended-v*-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "pagefind_extended-v*-aarch64-apple-darwin.tar.gz" }

[tasks."admin:build"]
description = "管理画面をビルドする（web/admin/dist）"
dir = "web/admin"
run = ["pnpm install --frozen-lockfile", "pnpm build"]

[tasks."docs:dev"]
description = "ドキュメントのサイト（VitePress）を http://localhost:5173/ で開く。検索は docs:build のあとの docs:preview で使える"
dir = "docs"
run = ["pnpm install --frozen-lockfile", "pnpm dev"]

[tasks."docs:build"]
description = "ドキュメントのサイトを docs/.vitepress/dist に書き出し、Pagefind（pagefind_extended）で検索の索引を作る"
dir = "docs"
run = ["pnpm install --frozen-lockfile", "pnpm build"]

[tasks."docs:preview"]
description = "書き出したドキュメントのサイトを http://localhost:4173/ で開く（先に docs:build）"
dir = "docs"
run = "pnpm preview"

[tasks.dev]
description = "開発用のDBとMailpitを起動し、管理画面をビルドしてGo本体を起動する"
depends = ["admin:build"]
run = [
  "docker compose -f deploy/compose.dev.yaml up -d --wait",
  "go run ./cmd/pagewright migrate",
  "go run ./cmd/pagewright serve",
]

[tasks.build]
description = "管理画面を埋め込んだ pagewright のバイナリを bin/ に作る"
depends = ["admin:build"]
run = "go build -tags embedadmin -o bin/pagewright ./cmd/pagewright"

[tasks.test]
description = "Goと管理画面のテスト（GoのテストのDBは compose.dev.yaml のものを使う）"
run = ["go test ./...", "pnpm --dir web/admin test"]

[tasks.lint]
description = "Goのlint、マイグレーションの検査、管理画面のlint、GitHub Actions の検査"
run = [
  "golangci-lint run",
  "pnpm --dir web/admin lint",
  "squawk internal/db/migrations/*.sql",
  "actionlint",
]

[tasks.gen]
description = "sqlcでGoコードを生成する"
run = "sqlc generate"

[tasks."sample:load"]
description = "コーポレートテーマのサンプル（架空の会社）を新しいサイトに入れる。先に mise run dev で本体を起動しておく"
run = """
url=$(go run ./cmd/pagewright init --site "みどり野設備株式会社" --email "${SAMPLE_EMAIL:-sample@example.com}" | tail -1)
go run ./tools/sampleload -login "$url"
echo "管理画面に入るときは: go run ./cmd/pagewright login-url --email ${SAMPLE_EMAIL:-sample@example.com}"
"""

[tasks.down]
description = "開発用のDBとMailpitを止める"
run = "docker compose -f deploy/compose.dev.yaml down"
