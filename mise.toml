[tools]
go = "latest"
node = "lts"
pnpm = "latest"
"aqua:sqlc-dev/sqlc" = "latest"
"aqua:pressly/goose" = "latest"
"aqua:golangci/golangci-lint" = "latest"
"aqua:goreleaser/goreleaser" = "latest"
"github:sbdchd/squawk" = "2.74.0"
"github:Pagefind/pagefind" = { version = "1.6.0", asset_pattern = "pagefind_extended-*" }

[tasks."admin:build"]
description = "管理画面をビルドする（web/admin/dist）"
dir = "web/admin"
run = ["pnpm install --frozen-lockfile", "pnpm build"]

[tasks.dev]
description = "開発用のDBとMailpitを起動し、管理画面をビルドしてGo本体を起動する"
depends = ["admin:build"]
run = [
  "docker compose -f deploy/compose.dev.yaml up -d --wait",
  "go run ./cmd/pagewright migrate",
  "go run ./cmd/pagewright serve",
]

[tasks.test]
description = "Goと管理画面のテスト（GoのテストのDBは compose.dev.yaml のものを使う）"
run = ["go test ./...", "pnpm --dir web/admin test"]

[tasks.lint]
description = "Goのlint、マイグレーションの検査、管理画面のlint"
run = [
  "golangci-lint run",
  "pnpm --dir web/admin lint",
  "squawk internal/db/migrations/*.sql",
]

[tasks.gen]
description = "sqlcでGoコードを生成する"
run = "sqlc generate"

[tasks.down]
description = "開発用のDBとMailpitを止める"
run = "docker compose -f deploy/compose.dev.yaml down"
