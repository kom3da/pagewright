[tools]
go = "latest"
node = "lts"
pnpm = "latest"
"aqua:sqlc-dev/sqlc" = "latest"
"aqua:pressly/goose" = "latest"
"aqua:golangci/golangci-lint" = "latest"
"aqua:goreleaser/goreleaser" = "latest"
"github:sbdchd/squawk" = "2.74.0"

[tasks.dev]
description = "開発用のDBとMailpitを起動し、Go本体を起動する"
run = [
  "docker compose -f deploy/compose.dev.yaml up -d",
  "go run ./cmd/pagewright serve",
]

[tasks.test]
description = "Goのテスト（DBは compose.dev.yaml のものを使う）"
run = "go test ./..."

[tasks.lint]
description = "Goのlintとマイグレーションの検査"
run = [
  "golangci-lint run",
  "squawk internal/db/migrations/*.sql",
]

[tasks.gen]
description = "sqlcでGoコードを生成する"
run = "sqlc generate"

[tasks.down]
description = "開発用のDBとMailpitを止める"
run = "docker compose -f deploy/compose.dev.yaml down"
